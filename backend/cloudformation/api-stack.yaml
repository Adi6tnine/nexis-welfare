AWSTemplateFormatVersion: '2010-09-09'
Description: 'NEXIS API Stack - API Gateway Configuration'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource naming

  ComputeStackName:
    Type: String
    Description: Name of the compute stack to import Lambda function ARNs

Resources:
  # API Gateway REST API
  NexisAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'nexis-api-${Environment}'
      Description: NEXIS API Gateway for eligibility checking and AI services
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: NEXIS

  # API Key for Authentication
  NexisAPIKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - NexisAPIDeployment
      - NexisAPIStage
    Properties:
      Name: !Sub 'nexis-api-key-${Environment}'
      Description: API Key for NEXIS API authentication
      Enabled: true
      StageKeys:
        - RestApiId: !Ref NexisAPI
          StageName: !Ref Environment

  # Usage Plan
  NexisUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - NexisAPIDeployment
      - NexisAPIStage
    Properties:
      UsagePlanName: !Sub 'nexis-usage-plan-${Environment}'
      Description: Usage plan for NEXIS API with rate limiting
      ApiStages:
        - ApiId: !Ref NexisAPI
          Stage: !Ref Environment
      Throttle:
        RateLimit: 100
        BurstLimit: 200
      Quota:
        Limit: 10000
        Period: DAY

  # Link API Key to Usage Plan
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref NexisAPIKey
      KeyType: API_KEY
      UsagePlanId: !Ref NexisUsagePlan

  # Resource: /eligibility
  EligibilityResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref NexisAPI
      ParentId: !GetAtt NexisAPI.RootResourceId
      PathPart: eligibility

  # Resource: /eligibility/check
  EligibilityCheckResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref NexisAPI
      ParentId: !Ref EligibilityResource
      PathPart: check

  # Method: POST /eligibility/check
  EligibilityCheckMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref EligibilityCheckResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn:
              Fn::ImportValue: !Sub '${ComputeStackName}-EligibilityCheckerFunctionArn'
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # OPTIONS method for CORS on /eligibility/check
  EligibilityCheckOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref EligibilityCheckResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Resource: /ai
  AIResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref NexisAPI
      ParentId: !GetAtt NexisAPI.RootResourceId
      PathPart: ai

  # Resource: /ai/explain
  AIExplainResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref NexisAPI
      ParentId: !Ref AIResource
      PathPart: explain

  # Method: POST /ai/explain
  AIExplainMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref AIExplainResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn:
              Fn::ImportValue: !Sub '${ComputeStackName}-AIExplanationFunctionArn'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # OPTIONS method for CORS on /ai/explain
  AIExplainOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref AIExplainResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Resource: /chat
  ChatResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref NexisAPI
      ParentId: !GetAtt NexisAPI.RootResourceId
      PathPart: chat

  # Resource: /chat/message
  ChatMessageResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref NexisAPI
      ParentId: !Ref ChatResource
      PathPart: message

  # Method: POST /chat/message
  ChatMessageMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref ChatMessageResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn:
              Fn::ImportValue: !Sub '${ComputeStackName}-ChatAssistantFunctionArn'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # OPTIONS method for CORS on /chat/message
  ChatMessageOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref ChatMessageResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Resource: /profiles
  ProfilesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref NexisAPI
      ParentId: !GetAtt NexisAPI.RootResourceId
      PathPart: profiles

  # Method: POST /profiles
  ProfilesPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref ProfilesResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn:
              Fn::ImportValue: !Sub '${ComputeStackName}-ProfileManagerFunctionArn'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # Resource: /profiles/{userId}
  ProfileUserIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref NexisAPI
      ParentId: !Ref ProfilesResource
      PathPart: '{userId}'

  # Method: GET /profiles/{userId}
  ProfilesGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref ProfileUserIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn:
              Fn::ImportValue: !Sub '${ComputeStackName}-ProfileManagerFunctionArn'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # Method: PUT /profiles/{userId}
  ProfilesPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref ProfileUserIdResource
      HttpMethod: PUT
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn:
              Fn::ImportValue: !Sub '${ComputeStackName}-ProfileManagerFunctionArn'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # Method: DELETE /profiles/{userId}
  ProfilesDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref ProfileUserIdResource
      HttpMethod: DELETE
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn:
              Fn::ImportValue: !Sub '${ComputeStackName}-ProfileManagerFunctionArn'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # OPTIONS method for CORS on /profiles/{userId}
  ProfilesOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref ProfileUserIdResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Resource: /schemes
  SchemesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref NexisAPI
      ParentId: !GetAtt NexisAPI.RootResourceId
      PathPart: schemes

  # Method: POST /schemes
  SchemesPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref NexisAPI
      ResourceId: !Ref SchemesResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn:
              Fn::ImportValue: !Sub '${ComputeStackName}-SchemeUploaderFunctionArn'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # Lambda Permissions
  EligibilityCheckerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub '${ComputeStackName}-EligibilityCheckerFunctionArn'
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NexisAPI}/*'

  AIExplanationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub '${ComputeStackName}-AIExplanationFunctionArn'
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NexisAPI}/*'

  ChatAssistantInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub '${ComputeStackName}-ChatAssistantFunctionArn'
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NexisAPI}/*'

  ProfileManagerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub '${ComputeStackName}-ProfileManagerFunctionArn'
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NexisAPI}/*'

  SchemeUploaderInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub '${ComputeStackName}-SchemeUploaderFunctionArn'
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${NexisAPI}/*'

  # API Deployment
  NexisAPIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - EligibilityCheckMethod
      - AIExplainMethod
      - ChatMessageMethod
      - ProfilesPostMethod
      - ProfilesGetMethod
      - ProfilesPutMethod
      - ProfilesDeleteMethod
      - SchemesPostMethod
    Properties:
      RestApiId: !Ref NexisAPI

  # API Stage
  NexisAPIStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref NexisAPI
      DeploymentId: !Ref NexisAPIDeployment
      StageName: !Ref Environment
      Description: !Sub 'NEXIS API ${Environment} stage'
      TracingEnabled: false
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: NEXIS

Outputs:
  APIEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${NexisAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-APIEndpoint'

  APIId:
    Description: API Gateway ID
    Value: !Ref NexisAPI
    Export:
      Name: !Sub '${AWS::StackName}-APIId'

  APIKeyId:
    Description: API Key ID
    Value: !Ref NexisAPIKey
    Export:
      Name: !Sub '${AWS::StackName}-APIKeyId'
