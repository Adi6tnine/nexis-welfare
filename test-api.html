<!DOCTYPE html>
<html>
<head>
    <title>Test NEXIS API</title>
</head>
<body>
    <h1>Test NEXIS API</h1>
    <button onclick="testAPI()">Test Eligibility Check</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';

            const payload = {
                userId: 'test-user-123',
                profile: {
                    age: 19,
                    state: 'AP',
                    occupation: 'Student',
                    annualIncome: 12313,
                    gender: 'Male',
                    socialCategory: 'General',
                    hasDisability: false
                }
            };

            console.log('Sending:', JSON.stringify(payload, null, 2));

            try {
                const response = await fetch('https://b73ak67e9k.execute-api.us-east-1.amazonaws.com/dev/eligibility/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': 'SX6unNPbujaAPaTOF8q8Y8CH44x0gWWcWtkh0QF2'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                console.log('Response:', data);
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Error:', error);
                result.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
