version: '3.8'

services:
  # LocalStack for AWS service simulation (S3, API Gateway, etc.)
  localstack:
    image: localstack/localstack:latest
    container_name: nexis-localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=s3,apigateway,lambda,iam,cloudwatch,logs
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./localstack-data:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - nexis-network

  # DynamoDB Local for database simulation
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: nexis-dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - "./dynamodb-data:/data"
    networks:
      - nexis-network

  # DynamoDB Admin UI (optional, for easier database management)
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: nexis-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - dynamodb-local
    networks:
      - nexis-network

networks:
  nexis-network:
    driver: bridge

volumes:
  localstack-data:
  dynamodb-data:
